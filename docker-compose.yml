# ==============================================================================
# PROYECTO 2: PLATAFORMA E-COMMERCE DISTRIBUIDA CON ARQUITECTURA ZERO TRUST
# CURSO: AUDITORÍA Y SEGURIDAD DE SISTEMAS - DÉCIMO CICLO UMG
# HARDENING DOCKER COMPLETO (Sección 13 & SEC-5):
# 1. Puertos de MariaDB y Redis NO expuestos a 0.0.0.0 (Sin sección 'ports')
# 2. Red interna privada aislada 'ecommerce_net'
# 3. Contenedores de aplicación ejecutados con usuario www-data (no-root)
# 4. Volúmenes independientes (audit_data aislado de los de negocio)
# 5. Límites de recursos (mem_limit / cpus) contra ataques DoS
# ==============================================================================

version: '3.8'

networks:
  ecommerce_net:
    driver: bridge

volumes:
  master_data:
    name: technova_master_db_data
  slave_data:
    name: technova_slave_db_data
  audit_data:
    name: technova_audit_db_independent_data
  redis_data:
    name: technova_redis_cache_data

services:

  # ----------------------------------------------------------------------------
  # 1. API GATEWAY (NGINX + WAF BÁSICO + RATE LIMITING + REVERSE PROXY)
  # ÚNICO SERVICIO CON PUERTOS PÚBLICOS EXPUESTOS
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: technova-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${GATEWAY_SSL_PORT:-443}:443"
    volumes:
      - ./gateway/html:/var/www/html:ro
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ecommerce_net
    depends_on:
      - auth-service
      - catalogo-service
      - pedidos-service
      - pagos-service
      - security-audit-service
      - notificaciones-service
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. AUTH-SERVICE (REGISTRO, LOGIN, JWT, ROLES, INTENTOS FALLIDOS)
  # ----------------------------------------------------------------------------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: technova-auth-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/common:/var/www/common:ro
      - ./services/common:/var/www/html/services/common:ro
      - ./services/auth-service/src:/var/www/html/src
    networks:
      - ecommerce_net
    depends_on:
      - mariadb-master
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 3. CATALOGO-SERVICE (PRODUCTOS, CATEGORÍAS, LECTURAS EN SLAVE, REDIS CACHE)
  # ----------------------------------------------------------------------------
  catalogo-service:
    build:
      context: ./services/catalogo-service
      dockerfile: Dockerfile
    container_name: technova-catalogo-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/common:/var/www/common:ro
      - ./services/common:/var/www/html/services/common:ro
      - ./services/catalogo-service/src:/var/www/html/src
    networks:
      - ecommerce_net
    depends_on:
      - mariadb-master
      - mariadb-slave
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. PEDIDOS-SERVICE (CARRITO, PEDIDOS, VERIFICACIÓN DE PRECIO EN SERVIDOR)
  # ----------------------------------------------------------------------------
  pedidos-service:
    build:
      context: ./services/pedidos-service
      dockerfile: Dockerfile
    container_name: technova-pedidos-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/common:/var/www/common:ro
      - ./services/common:/var/www/html/services/common:ro
      - ./services/pedidos-service/src:/var/www/html/src
    networks:
      - ecommerce_net
    depends_on:
      - mariadb-master
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 5. PAGOS-SERVICE (CHECKOUT, PCI-DSS COMPLIANT, WEBHOOK STRIPE CON FIRMA)
  # ----------------------------------------------------------------------------
  pagos-service:
    build:
      context: ./services/pagos-service
      dockerfile: Dockerfile
    container_name: technova-pagos-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/common:/var/www/common:ro
      - ./services/common:/var/www/html/services/common:ro
      - ./services/pagos-service/src:/var/www/html/src
    networks:
      - ecommerce_net
    depends_on:
      - mariadb-master
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 6. SECURITY-AUDIT-SERVICE (APPEND-ONLY, 14 EVENTOS DE AUDITORÍA, METRICAS)
  # ----------------------------------------------------------------------------
  security-audit-service:
    build:
      context: ./services/security-audit-service
      dockerfile: Dockerfile
    container_name: technova-security-audit-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/common:/var/www/common:ro
      - ./services/common:/var/www/html/services/common:ro
      - ./services/security-audit-service/src:/var/www/html/src
    networks:
      - ecommerce_net
    depends_on:
      - mariadb-audit
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 7. NOTIFICACIONES-SERVICE (EMAILS TRANSACCIONALES EMAILJS)
  # ----------------------------------------------------------------------------
  notificaciones-service:
    build:
      context: ./services/notificaciones-service
      dockerfile: Dockerfile
    container_name: technova-notificaciones-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/common:/var/www/common:ro
      - ./services/common:/var/www/html/services/common:ro
      - ./services/notificaciones-service/src:/var/www/html/src
    networks:
      - ecommerce_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ----------------------------------------------------------------------------
  # 8. MARIADB MASTER (ESCRITURAS DE NEGOCIO: AUTH, CATALOGO, PEDIDOS, PAGOS)
  # HARDENING: SIN PORTS EXPUESTOS AL EXTERIOR (Solo accesible en ecommerce_net)
  # ----------------------------------------------------------------------------
  mariadb-master:
    image: mariadb:10.6
    container_name: technova-mariadb-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-MasterSecPass_2026_TechNova!}
      MYSQL_DATABASE: ${DB_AUTH_NAME:-auth_db}
      MYSQL_USER: ${DB_USER:-technova_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-AppMasterPass_2026!}
    volumes:
      - master_data:/var/lib/mysql
      - ./database/master/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/master/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 9. MARIADB SLAVE (LECTURAS DE ALTA DISPONIBILIDAD PARA CATÁLOGO Y REPORTES)
  # HARDENING: SIN PORTS EXPUESTOS AL EXTERIOR
  # ----------------------------------------------------------------------------
  mariadb-slave:
    image: mariadb:10.6
    container_name: technova-mariadb-slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_SLAVE_ROOT_PASSWORD:-SlaveSecPass_2026_TechNova!}
      DB_MASTER_HOST: mariadb-master
      DB_REPL_USER: ${DB_REPL_USER:-replicator}
      DB_REPL_PASSWORD: ${DB_REPL_PASSWORD:-ReplicationPass_2026!}
    volumes:
      - slave_data:/var/lib/mysql
      - ./database/slave/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/slave/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce_net
    depends_on:
      - mariadb-master
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 10. MARIADB AUDIT (INSTANCIA DEDICADA DE AUDITORÍA EN VOLUMEN SEPARADO)
  # HARDENING: AISLADA, SIN PUERTOS PÚBLICOS, VOLUMEN INDEPENDIENTE
  # ----------------------------------------------------------------------------
  mariadb-audit:
    image: mariadb:10.6
    container_name: technova-mariadb-audit
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_AUDIT_ROOT_PASSWORD:-AuditSecPass_2026_TechNova!}
      MYSQL_DATABASE: ${DB_AUDIT_NAME:-audit_db}
      MYSQL_USER: ${DB_AUDIT_USER:-audit_service_user}
      MYSQL_PASSWORD: ${DB_AUDIT_PASSWORD:-AuditServicePass_2026!}
    volumes:
      - audit_data:/var/lib/mysql
      - ./database/audit/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/audit/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  # ----------------------------------------------------------------------------
  # 11. REDIS CACHE (CACHÉ DE CATÁLOGO, BLACKLIST JWT, RATE LIMITING)
  # HARDENING: SIN PORTS EXPUESTOS AL EXTERIOR, PROTEGIDO CON PASSWORD
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: technova-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-RedisSecPass_2026_TechNova!}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 192M
