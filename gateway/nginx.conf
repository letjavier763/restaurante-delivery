worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ocultar versión de Nginx (Hardening OWASP A05)
    server_tokens off;

    # Rate limiting global: 15 req/segundo por IP con burst de 30
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Formato de log seguro con IP real
    log_format main_secure '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main_secure;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Compresión gzip para alta velocidad
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost _;

        root /var/www/html;
        index index.html;

        # Hardening de Cabeceras de Seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ----------------------------------------------------------------------
        # WAF BÁSICO INTEGRADO EN NGINX (Sección 3.2 del documento)
        # Bloquea patrones comunes de SQL Injection, XSS y Path Traversal
        # ----------------------------------------------------------------------
        # Bloqueo de SQL Injection en query string
        if ($query_string ~* "(\bunion\b.*\bselect\b|\bselect\b.*\bfrom\b|\binsert\b.*\binto\b|\bdrop\b\s+(table|database)|\bexec(\s|\+)+(s|x)p\w+|\binformation_schema\b)") {
            return 403;
        }

        # Bloqueo de XSS en query string
        if ($query_string ~* "(<script|%3Cscript|javascript:|onerror=|onload=|eval\()") {
            return 403;
        }

        # Bloqueo de Path Traversal
        if ($request_uri ~* "(\.\./|\.\.\\|/etc/passwd|/proc/self)") {
            return 403;
        }

        # Bloqueo de User Agents maliciosos conocidos
        if ($http_user_agent ~* "(sqlmap|nikto|w3af|acunetix|nessus)") {
            return 403;
        }

        # ----------------------------------------------------------------------
        # ENRUTAMIENTO DE MICROSERVICIOS (API GATEWAY)
        # ----------------------------------------------------------------------

        # 1. auth-service (Rate limit estricto en auth)
        location /api/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. catalogo-service
        location /api/catalogo {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://catalogo-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. pedidos-service
        location /api/pedidos {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://pedidos-service:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. pagos-service
        location /api/pagos {
            limit_req zone=api_limit burst=15 nodelay;
            proxy_pass http://pagos-service:8084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. security-audit-service (Admin / Trazabilidad)
        location /api/audit {
            limit_req zone=api_limit burst=25 nodelay;
            proxy_pass http://security-audit-service:8086;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 6. notificaciones-service
        location /api/notificaciones {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://notificaciones-service:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend SPA estático
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Páginas de error personalizadas
        error_page 403 /403.html;
        location = /403.html {
            internal;
            return 403 '{"error": "Petición bloqueada por WAF de Seguridad (Regla OWASP)."}';
        }

        error_page 429 /429.html;
        location = /429.html {
            internal;
            return 429 '{"error": "Demasiadas peticiones. Límite de tasa excedido (Rate Limiting)."}';
        }
    }
}
